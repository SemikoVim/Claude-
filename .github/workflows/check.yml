# Vérifie que tous les fichiers apps/*.json sont valides à chaque push ou pull request.
name: Vérifier les applications

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node src/build.js --check
